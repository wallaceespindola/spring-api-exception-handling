spring:
  application:
    name: spring-api-exception-handling
  web:
    # ponytail: English unless the client sends Accept-Language, so error text doesn't follow the server OS locale
    locale: en
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    java:
      enabled: true

info:
  app:
    name: "@project.name@"
    version: "@project.version@"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
