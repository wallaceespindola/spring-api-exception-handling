version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # ponytail: majors here are JDK/Node releases; move LTS-to-LTS by hand
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # builder tag encodes the JDK in a suffix (temurin-25 -> 26), which the rule above misses
      - dependency-name: "maven"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
