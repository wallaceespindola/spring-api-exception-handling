services:
  app:
    build: .
    image: spring-api-exception-handling:latest
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - app-logs:/app/logs
    networks:
      - app-net

volumes:
  app-logs:

networks:
  app-net:
